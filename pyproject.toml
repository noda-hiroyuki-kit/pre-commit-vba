[project]
name = "pre-commit-vba"
version = "0.4.9"
description = "Extracts VBA code from Office files for managing VBA code in git and checks Office file integrity."
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    "olefile>=0.47",
    "pywin32>=312;platform_system == 'Windows'",
    "typer>=0.27.3",
]

[project.scripts]
pre-commit-vba = "pre_commit_vba.pre_commit_vba:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pyyaml>=6.0.3",
    "python-slugify>=9.1.3",
    "ruff>=0.17.2",
    "termynal>=0.14.0",
    "tox>=4.67.1",
    "tox-uv>=1.37.0",
    "zensical>=0.0.72",
    "types-pyyaml>=6.0.12.20260906",
    "tomli-w>=1.2.0",
    "ty>=0.0.91",
]

[tool.uv]
prerelease = "disallow"
#exclude-newer-package = {ruff = false, uv=false, ty=false}
#exclude-newer = "10 days"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["ALL"]
ignore = [
    # Based on Ruff's formatter conflict guidance:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191", # tab-indentation
    "E111", # indentation-with-invalid-multiple
    "E114", # indentation-with-invalid-multiple-comment
    "E117", # over-indented
    "D203", # incorrect-blank-line-before-class
    "D206", # docstring-tab-indentation
    "D213", # multi-line-summary-second-line
    "D300", # triple-single-quotes
    "Q000", # bad-quotes-inline-string
    "Q001", # bad-quotes-multiline-string
    "Q002", # bad-quotes-docstring
    "Q003", # avoidable-escaped-quote
    "Q004", # unnecessary-escaped-quote
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma
    "ISC002", # multi-line-implicit-string-concatenation
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Use `\n` line endings for all files
line-ending = "lf"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ty]
[tool.ty.environment]
python-version = "3.14"
root = ["src"]

[tool.ty.src]
include = ["src", "scripts"]
respect-ignore-files = true

[tool.ty.analysis]
allowed-unresolved-imports = ["pywintypes", "win32com.**"]

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["dependency", "fix", "type", "3.14", "3.15"]

[tool.tox.env."3.14"]
base_python = "3.14.9"
uv_python_preference = "system"

[tool.tox.env."3.15"]
base_python = "3.15.1"
uv_python_preference = "system"

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "Run test under {base_python}"
allowlist_externals = ["pytest", "ty", "prek","uv", "pinact", "zizmor"]
commands=[["pytest"]]

[tool.tox.env.dependency]
runner = "uv-venv-lock-runner"
description = "update dependency"
skip_install = true
commands = [
    ["prek", "update", "--cooldown-days", "10"],
    ["uv", "run", "scripts/pinact.py"],
    ["uv", "lock", "-U"],
    ["uv", "sync"],
]

[tool.tox.env.fix]
runner = "uv-venv-lock-runner"
description = "run code formatter and linter (auto-fix)"
skip_install = true
commands = [
    ["prek", "run", "--all-files", "--show-diff-on-failure"],
]

[tool.tox.env.type]
runner = "uv-venv-lock-runner"
description = "run type checker via ty"
skip_install = true
commands = [
    ["uv", "run", "ty", "check"],
]

[tool.pytest]
minversion = "9.1.1"
addopts = ["-v", "-s", "--strict-markers", "--cov", "--cov-report=html", "--cov-report=term"]
testpaths = [
    "tests"
]
markers=["develop_research"]

[tool.coverage.run]
source = ["src/pre_commit_vba", "scripts"]
[tool.coverage.report]
fail_under = 80
exclude_also = [
    "raise NotImplementedError",
]

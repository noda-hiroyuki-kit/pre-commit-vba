---
name: pre-commit autoupdate

"on":
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

      - name: Update prek hooks
        run: prek update --cooldown-days 10

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: prek autoupdate"
          title: "chore: prek autoupdate"
          body: |
            Automated update of `.pre-commit-config.yaml` by GitHub Actions.

            - Ran `prek update --cooldown-days 10`
            - Schedule: every Friday 18:00 Asia/Tokyo
          branch: chore/pre-commit-autoupdate
          delete-branch: true
          add-paths: |
            .pre-commit-config.yaml

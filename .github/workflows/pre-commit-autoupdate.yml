---
name: pre-commit autoupdate

"on":
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true

      - name: Update prek hooks
        run: prek update --cooldown-days 10

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore: prek autoupdate"
          title: "chore: prek autoupdate"
          body: |
            Automated update of `.pre-commit-config.yaml` by GitHub Actions.

            - Ran `prek update --cooldown-days 10`
            - Schedule: every Friday 18:00 Asia/Tokyo
          branch: chore/pre-commit-autoupdate
          delete-branch: true
          add-paths: |
            .pre-commit-config.yaml
